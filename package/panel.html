<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Models</title><style>:root {
	color-scheme: dark;
	font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
	font-size: 14px;
	color: var(--foreground);
	background: var(--background);
	--background: #111111;
	--foreground: #eeeeee;
	--accent: #8f9bff;
	--surface: color-mix(in srgb, var(--foreground) 4%, var(--background));
	--control: color-mix(in srgb, var(--foreground) 7%, var(--background));
	--hover: color-mix(in srgb, var(--foreground) 11%, var(--background));
	--border: color-mix(in srgb, var(--foreground) 13%, var(--background));
	--muted: color-mix(in srgb, var(--foreground) 64%, var(--background));
}
* {
	box-sizing: border-box;
}
body {
	margin: 0;
	padding: 24px 28px;
}
main {
	max-width: 760px;
	margin-inline: auto;
}
h1,
h2,
h3,
p {
	margin: 0;
}
h1 {
	font-size: 24px;
	line-height: 1.3;
	font-weight: 600;
	letter-spacing: -0.5px;
}
h2 {
	font-size: 16px;
	line-height: 1.4;
	font-weight: 600;
}
h3 {
	font-size: 14px;
	line-height: 1.5;
	font-weight: 500;
}
p {
	line-height: 1.5;
}
header {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 16px;
	margin-block-end: 20px;
}
header p {
	margin-block-start: 6px;
	color: var(--muted);
}
button,
select {
	color: inherit;
	font: inherit;
	border: 0;
	background: var(--control);
	border-radius: 8px;
	min-height: 34px;
	padding: 7px 12px;
}
button {
	cursor: pointer;
	font-size: 13px;
	white-space: nowrap;
}
button:hover {
	background: var(--hover);
}
button:disabled {
	cursor: default;
	opacity: 0.45;
}
button.primary {
	color: var(--foreground);
	background: color-mix(in srgb, var(--accent) 24%, var(--background));
}
button.primary:hover {
	background: color-mix(in srgb, var(--accent) 35%, var(--background));
}
button.quiet {
	background: transparent;
}
button.quiet:hover {
	background: var(--hover);
}
select {
	width: 100%;
	min-width: 0;
	cursor: pointer;
	text-overflow: ellipsis;
	padding-inline-end: 28px;
}
select:disabled {
	cursor: default;
}
button:focus-visible,
select:focus-visible,
a:focus-visible,
summary:focus-visible {
	outline: 2px solid var(--accent);
	outline-offset: 3px;
}
[hidden] {
	display: none !important;
}
.execution {
	display: flex;
	align-items: center;
	gap: 9px;
	color: var(--muted);
	font-size: 12px;
	min-height: 32px;
	margin-block-end: 28px;
}
.execution-hint {
	margin-inline-start: auto;
}
.dot {
	width: 6px;
	height: 6px;
	flex: 0 0 auto;
	border-radius: 50%;
	background: var(--muted);
}
.dot.working {
	background: var(--accent);
}
.section-heading {
	margin-block-end: 6px;
}
.routes {
	display: grid;
}
.route {
	display: grid;
	grid-template-columns: minmax(140px, 1fr) minmax(220px, 48%);
	gap: 20px;
	align-items: center;
	padding-block: 16px;
}
.route + .route {
	border-block-start: 1px solid var(--border);
}
.route-label label {
	display: inline-block;
	font-weight: 500;
	margin-block-end: 5px;
}
.route-label p {
	max-width: 38ch;
	color: var(--muted);
	font-size: 12px;
}
.save-row {
	display: flex;
	align-items: center;
	flex-wrap: wrap;
	gap: 10px;
	margin-block-start: 14px;
}
.save-hint {
	color: var(--muted);
	font-size: 12px;
}
#message {
	min-height: 21px;
	margin-block: 12px 18px;
	font-size: 13px;
}
.error {
	color: var(--foreground);
}
.error::before {
	content: "! ";
	color: var(--accent);
}
.section-disclosure {
	border-block-start: 1px solid var(--border);
}
summary {
	cursor: pointer;
	user-select: none;
}
.section-disclosure > summary {
	padding-block: 17px;
	font-size: 14px;
	font-weight: 500;
}
.section-disclosure > summary > span {
	margin-inline-start: 8px;
	font-weight: 400;
	font-size: 12px;
	color: var(--muted);
}
.disclosure-body {
	padding-block: 0 22px;
}
.disclosure-body > p {
	color: var(--muted);
	font-size: 13px;
	margin-block-end: 14px;
}
.models {
	display: grid;
	gap: 0;
	margin-block-start: 16px;
}
article {
	padding-block: 16px;
}
article + article {
	border-block-start: 1px solid var(--border);
}
.model-row {
	display: flex;
	justify-content: space-between;
	align-items: center;
	gap: 16px;
}
.model-row p {
	margin-block-start: 4px;
	color: var(--muted);
	font-size: 12px;
}
.model-details {
	margin-block-start: 10px;
	color: var(--muted);
	font-size: 12px;
}
.model-details > div {
	padding-block-start: 10px;
}
.model-details p + p {
	margin-block-start: 8px;
}
a {
	color: var(--foreground);
	text-underline-offset: 3px;
	cursor: pointer;
}
.model-details a {
	display: inline-block;
	margin-block-start: 10px;
}
.storage-details {
	font-size: 13px;
	color: var(--muted);
	margin-block-start: 16px;
}
.storage-details > div {
	padding-block-start: 12px;
}
.storage-details p {
	margin-block-end: 10px;
	overflow-wrap: anywhere;
}
code {
	font-family: "Geist Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
	font-size: 11px;
}
.path {
	overflow-wrap: anywhere;
}
.history > div,
.found {
	display: flex;
	justify-content: space-between;
	gap: 12px;
	padding-block: 10px;
	font-size: 12px;
}
.history strong {
	font-weight: 500;
}
.history span,
.found span {
	color: var(--muted);
}
#discovery p {
	margin-block-start: 12px;
}
#installation:not(:empty) {
	padding: 14px 16px;
	margin-block: 14px;
	background: var(--surface);
	border-radius: 10px;
	font-size: 12px;
}
#installation progress {
	display: block;
	width: 100%;
	margin-block: 10px 6px;
	accent-color: var(--accent);
}
#installation button {
	display: inline-block;
	margin-inline-start: 12px;
}
footer {
	margin-block-start: 24px;
	color: var(--muted);
	font-size: 12px;
}
.loading {
	color: var(--muted);
}
::selection {
	background: var(--accent);
	color: var(--background);
}
@media (max-width: 590px) {
	body {
		padding: 20px 18px;
	}
	.route {
		grid-template-columns: minmax(0, 1fr);
		gap: 10px;
		padding-block: 15px;
	}
	.route-label p {
		max-width: none;
	}
	.execution {
		flex-wrap: wrap;
	}
	.execution-hint {
		margin-inline-start: 15px;
	}
	.history > div {
		flex-wrap: wrap;
	}
}
@media (prefers-reduced-motion: reduce) {
	* {
		scroll-behavior: auto;
	}
}
</style><main id="root"></main><script>// Include this in a prebuilt panel. No credential values or arbitrary IPC are exposed.
const waiting = new Map();
const contextListeners = new Set();
let seq = 0;
window.addEventListener("message", (event) => {
  if (event.source !== parent) return;
  if (event.data?.type === "studio-plugin-context-changed") {
    for (const listener of contextListeners) {
      try {
        listener();
      } catch {}
    }
    return;
  }
  if (event.data?.type !== "studio-plugin-result") return;
  const p = waiting.get(event.data.id);
  if (!p) return;
  waiting.delete(event.data.id);
  clearTimeout(p.timer);
  event.data.error ? p.reject(new Error(event.data.error)) : p.resolve(event.data.result);
});
window.studioPlugin = {
  onContextChanged(callback) {
    contextListeners.add(callback);
    return () => contextListeners.delete(callback);
  },
  call(method, name, args, options) {
    // A long setup action may extend its local wait; host validation, confirmations and
    // execution deadlines still apply. Timing out never means a remote job was cancelled.
    const timeoutMs = options?.timeoutMs ?? 60000;
    if (!Number.isInteger(timeoutMs) || timeoutMs < 1000 || timeoutMs > 1800000)
      return Promise.reject(new Error("Invalid panel wait duration"));
    const id = String(++seq);
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => {
        waiting.delete(id);
        reject(new Error("Studio request timed out. Inspect its status before retrying."));
      }, timeoutMs);
      waiting.set(id, { resolve, reject, timer });
      parent.postMessage({ type: "studio-plugin-request", id, method, name, args }, "*");
    });
  },
};
window.addEventListener("pagehide", () => {
  for (const p of waiting.values()) {
    clearTimeout(p.timer);
    p.reject(new Error("Panel closed"));
  }
  waiting.clear();
});
</script><script>"use strict";
(() => {

  }

    if (model.state === "working") return "Working";

  }
  function modelRow(model) {

    panel.innerHTML = `<header><div><h1>Local Models</h1><p>Choose the models your AI uses.</p></div><button type="button" id="refresh" class="quiet">Refresh</button></header>${execution()}
  <form id="assignments"><section class="assignment-section" aria-labelledby="choose-models"><div class="section-heading"><h2 id="choose-models">Models for each task</h2></div><div class="routes">${routes.map(routeRow).join("")}</div><div class="save-row"><button id="save" type="submit" class="primary">Save changes</button><button id="discard" type="button" ${changes ? "" : "hidden"}>Discard changes</button><span class="save-hint">${changes ? "Unsaved changes" : "Applies to new requests"}</span></div></section></form>

  <footer><p>Models run locally and release their memory after each task. Paid tools are never used as a fallback.</p></footer>`;
    document.getElementById("refresh")?.addEventListener("click", () => void refresh());

    polling = true;
    const version = readVersion;
    void studioPlugin.call("action", "activity", {}).then(async (activity) => {
      if (!snapshot || busy || version !== readVersion) return;
      const settled = snapshot.installation.active && !activity.installation.active || snapshot.execution.active && !activity.execution.active;
      snapshot.execution = activity.execution;
      snapshot.installation = activity.installation;
      if (settled) {
        await readSnapshot();
        if (!busy) render();
        return;
      }
      const current = document.getElementById("execution-state");
      const nextExecution = execution();
      if (current && current.outerHTML !== nextExecution)
        current.outerHTML = nextExecution;
      showInstallation();
      controls();
    }).catch(() => {
    }).finally(() => {
      polling = false;
    });
  }, 1500);
  window.addEventListener("pagehide", () => clearInterval(poll), { once: true });
})();
</script></html>
